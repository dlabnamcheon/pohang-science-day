<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 게임 전시장</title>
<meta name="description" content="2026 경북창의과학한마당에서 친구들이 AI와 함께 만든 게임을 직접 해 보세요.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="logo" data-icon="pad"></span>
      <span><b>AI 게임 전시장</b><span>경북창의 과학한마당</span></span>
    </a>
    <a class="nav" href="index.html">전시장</a>
    <a class="btn" href="upload.html">게임 올리기</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="copy">
      <p class="eyebrow">AI Vibe Coding · Game Gallery</p>
      <h1>말하면 게임이 뚝딱! <em>AI 게임 만들기</em></h1>
      <p class="sub">AI 바이브코딩 체험 · 내가 만든 게임을 친구들과 함께!</p>
    </div>
    <div class="stat"><b id="statNum">00</b><span>등록된 참가작</span></div>
  </section>

  <section id="exWrap" hidden>
    <div class="sechead"><h2>선생님 예시 게임</h2><span class="chip">이렇게 만들 수 있어요</span></div>
    <div class="grid" id="exGrid"></div>
  </section>

  <div class="sechead">
    <h2>게임 전시장</h2>
    <span class="chip" id="chip">0개</span>
    <input class="search" type="search" id="q" placeholder="게임 이름이나 닉네임으로 찾기" autocomplete="off" aria-label="게임 찾기">
    <button class="linkbtn" id="reload" type="button"><span data-icon="refresh"></span>새로고침</button>
  </div>

  <div class="note err" id="err" hidden></div>
  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="more"><button class="btn soft" id="more" type="button" hidden>게임 더 보기</button></div>
</main>

<footer class="foot">D.LAB 코딩 남천학원 · AI 바이브코딩 체험 부스</footer>

<section class="player" id="player" hidden aria-label="게임 실행 화면">
  <div class="bar">
    <button type="button" id="back">← 전시장</button>
    <div class="who"><b id="pTitle"></b><span id="pAuthor"></span></div>
    <button type="button" id="restart">다시 시작</button>
    <button type="button" id="full">크게</button>
  </div>
  <div class="stage" id="stage">
    <div class="msg" id="pMsg">게임을 불러오는 중이에요…</div>
    <iframe id="frame" title="게임" hidden></iframe>
  </div>
</section>

<script type="module">
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, configured, esc, hashOf, timeAgo, mountGame, ICON, paintIcons } from "./common.js";

const $ = id => document.getElementById(id);
const PAGE = 48;
const TONES = ["#2453d4", "#1f3a8a", "#0f7a8a", "#6a3fd0"];
let games = [];      // {id, t, a, c}
let examples = [];
let shown = PAGE;
let currentHtml = "";
paintIcons();

function card(g) {
  const tone = g.x ? "#d9480f" : TONES[hashOf(g.id) % TONES.length];
  return `<article class="game">
    <div class="art" style="background:${tone}"><span class="tl">${g.x ? "EXAMPLE" : "GAME"}</span>${ICON.pad}<span class="br">MADE WITH AI</span></div>
    <div class="body">
      <div class="t">${esc(g.t)}</div>
      <div class="a">${esc(g.a)} · ${timeAgo(g.c)}</div>
      <button class="btn soft block" type="button" data-id="${esc(g.id)}">${ICON.play}게임하기</button>
    </div>
  </article>`;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = q ? games.filter(g => g.t.toLowerCase().includes(q) || g.a.toLowerCase().includes(q)) : games;
  $("grid").innerHTML = list.slice(0, shown).map(card).join("");
  $("exGrid").innerHTML = examples.map(card).join("");
  $("exWrap").hidden = !examples.length || !!q;
  $("more").hidden = list.length <= shown;
  $("statNum").textContent = String(games.length).padStart(2, "0");
  $("chip").textContent = q ? `${list.length}개 찾음` : `${games.length}개`;
  const empty = $("empty");
  if (!list.length) {
    empty.hidden = false;
    empty.innerHTML = q
      ? `<strong>찾는 게임이 없어요</strong>게임 이름이나 닉네임을 다시 확인해 보세요.`
      : `<strong>아직 등록된 게임이 없어요</strong>부스에서 첫 번째 게임을 만들어 올려 보세요.`;
  } else empty.hidden = true;
}

async function load() {
  $("err").hidden = true;
  if (!configured) {
    $("err").hidden = false;
    $("err").textContent = "아직 설정이 끝나지 않았어요. firebase-config.js 파일에 Firebase 설정값을 넣어 주세요.";
    render();
    return;
  }
  try {
    const snap = await getDoc(doc(db, "index", "all"));
    const g = (snap.exists() && snap.data().g) || {};
    const all = Object.entries(g)
      .filter(([, e]) => e && !e.h)
      .map(([id, e]) => ({ id, t: String(e.t || ""), a: String(e.a || ""), c: Number(e.c) || 0, x: !!e.x }))
      .sort((x, y) => y.c - x.c);
    examples = all.filter(v => v.x).reverse();
    games = all.filter(v => !v.x);
  } catch (e) {
    $("err").hidden = false;
    $("err").textContent = "게임 목록을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침을 눌러 주세요.";
  }
  render();
  route();
}

async function openGame(id) {
  const g = games.concat(examples).find(x => x.id === id);
  $("player").hidden = false;
  document.body.style.overflow = "hidden";
  $("pTitle").textContent = g ? g.t : "게임";
  $("pAuthor").textContent = g ? "만든이 " + g.a : "";
  $("frame").hidden = true;
  $("pMsg").hidden = false;
  $("pMsg").textContent = "게임을 불러오는 중이에요…";
  try {
    const snap = await getDoc(doc(db, "files", id));
    if (!snap.exists()) throw new Error("none");
    currentHtml = snap.data().html || "";
    start();
  } catch (e) {
    $("pMsg").textContent = "이 게임을 열 수 없어요. 전시장으로 돌아가 다른 게임을 골라 보세요.";
  }
}

function start() {
  const old = $("frame");
  const fresh = old.cloneNode(false);   // 새 틀로 바꿔야 게임이 처음부터 다시 시작됨
  fresh.removeAttribute("srcdoc");
  old.replaceWith(fresh);
  mountGame(fresh, currentHtml);
  fresh.hidden = false;
  $("pMsg").hidden = true;
  fresh.focus();
}

function closeGame() {
  $("player").hidden = true;
  document.body.style.overflow = "";
  $("frame").removeAttribute("srcdoc");
  $("frame").hidden = true;
  currentHtml = "";
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

function route() {
  const m = location.hash.match(/^#g-([A-Za-z0-9]+)$/);
  if (m) openGame(m[1]); else if (!$("player").hidden) closeGame();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (b) location.hash = "g-" + b.dataset.id;
});
$("back").addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); route(); });
$("restart").addEventListener("click", () => { if (currentHtml) start(); });
$("full").addEventListener("click", () => {
  const el = $("player");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
});
$("q").addEventListener("input", () => { shown = PAGE; render(); });
$("more").addEventListener("click", () => { shown += PAGE; render(); });
$("reload").addEventListener("click", load);
window.addEventListener("hashchange", route);

load();
</script>
</body>
</html>
